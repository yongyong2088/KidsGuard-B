name: Build KidsGuard APK

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK
        run: |
          # 直接用 runner 预装的 sdkmanager 安装所需组件（不再用已失效的 android-actions/setup-android@v3，它默认会尝试安装已废弃的 tools 包而失败）
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: 授予 Gradle 执行权限
        run: chmod +x gradlew

      - name: 编译 Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: 提取编译错误到 Summary
        if: always()
        run: |
          echo '## 编译错误摘要' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^e: | error:|What went wrong|Execution failed|Unresolved reference|Type mismatch|None of the following|cannot find symbol|Exception in" /tmp/gradle.log | head -60 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 上传完整编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log

      - name: 上传 APK 产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KidsGuard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
