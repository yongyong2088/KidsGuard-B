name: Build KidsGuard APK

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: 定位 Gradle 并授予执行权限
        id: locate
        run: |
          set -e
          echo "=== 仓库根结构 ==="
          ls -la
          GW=$(find . -name gradlew -type f | head -1)
          if [ -z "$GW" ]; then
            echo ">>> 未找到 gradlew，仓库目录树如下："
            find . -maxdepth 2 -type d | head -50
            exit 1
          fi
          GW_DIR=$(dirname "$GW")
          echo "gradlew 路径: $GW"
          echo "gradlew 所在目录: $GW_DIR"
          chmod +x "$GW"
          echo "gw_dir=$GW_DIR" >> "$GITHUB_OUTPUT"

      - name: 环境诊断
        run: |
          echo "=== Java 版本 ==="
          java -version
          echo "=== javac 版本 ==="
          javac -version
          echo "=== Gradle wrapper 信息 ==="
          GW="${{ steps.locate.outputs.gw_dir }}"
          cd "$GW"
          ls -la
          ls -la gradle/wrapper
          echo "=== settings.gradle.kts ==="
          cat settings.gradle.kts
          echo "=== build.gradle.kts ==="
          cat build.gradle.kts

      - name: 编译 Debug APK
        working-directory: ${{ steps.locate.outputs.gw_dir }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle.log

      - name: 提取编译错误到 Summary
        if: always()
        run: |
          echo '## Gradle 日志前 200 行' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -200 /tmp/gradle.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '## 编译错误摘要' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -iE "^e: |error:|FAILURE|FAILED|What went wrong|Execution failed|Unresolved reference|Type mismatch|None of the following|cannot find symbol|Exception|AAPT|Could not|Unable to|No cached version|Deprecated Gradle features|BUILD FAILED" /tmp/gradle.log | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 列出构建产物（诊断用）
        if: always()
        run: |
          echo "=== 当前仓库所有 .apk 文件 ==="
          find . -name "*.apk" | tee /tmp/apks.txt || true
          echo "=== app/build/outputs 目录 ==="
          ls -laR app/build/outputs 2>/dev/null || echo "（仓库根下无 app/build/outputs，说明项目可能在子目录）"
          echo "### 找到的 apk 列表" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/apks.txt >> "$GITHUB_STEP_SUMMARY" || echo "（无 apk）" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传完整编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          retention-days: 3

      - name: 上传 APK 产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KidsGuard-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
